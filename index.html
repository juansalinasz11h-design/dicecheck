<html>
<head>
<meta charset="utf-8">
<title>Online Dice</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #070b18;
    color: #fff;
    font-family: Segoe UI, Tahoma, sans-serif;
    overflow: hidden;
  }
  canvas#sky {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
  }
  .full {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    text-align: center;
  }
  .card {
    display: inline-block;
    width: 420px;
    margin-top: 12%;
    background: #14182c;
    border: 1px solid #2c3148;
    text-align: center;
    padding: 42px 36px 32px;
  }
  .mark {
    width: 46px;
    height: 46px;
    line-height: 46px;
    margin: 0 auto 16px;
    background: #4f46e5;
    font-weight: bold;
    font-size: 22px;
  }
  h1 { margin: 0; font-size: 28px; }
  .sub { margin: 8px 0 22px; color: #8b93a7; font-size: 13px; }
  .spin {
    width: 36px;
    height: 36px;
    line-height: 36px;
    margin: 0 auto;
    color: #7c74ff;
    font-size: 28px;
    font-family: Consolas, Courier New, monospace;
  }
  .scanlabel { margin: 12px 0 0; color: #8b93a7; font-size: 13px; }
  .barwrap {
    width: 220px;
    height: 6px;
    margin: 16px auto 0;
    background: #1c2033;
    text-align: left;
  }
  .bar { height: 6px; width: 0; background: #4f46e5; font-size: 0; }
  .check {
    width: 42px;
    height: 42px;
    line-height: 42px;
    margin: 0 auto 14px;
    background: #3a1820;
    color: #ff5c7a;
    font-weight: bold;
    font-size: 22px;
  }
  .found { margin: 0; font-size: 20px; font-weight: bold; }
  .done { margin: 8px 0 0; color: #8b93a7; font-size: 13px; }
  .instructions {
    margin: 16px 0 0;
    color: #d5d8e4;
    font-size: 14px;
    line-height: 1.45;
  }
  .type {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 42px;
    text-align: center;
    color: #9aa3b8;
    font-size: 13px;
    font-family: Consolas, Courier New, monospace;
    height: 18px;
  }
  .foot {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 18px;
    text-align: center;
    color: #6d758c;
    font-size: 12px;
  }
</style>
</head>
<body bgcolor="#070b18">
<canvas id="sky"></canvas>
<div class="full">
  <div class="card">
    <div class="mark">D</div>
    <h1>Online Dice</h1>
    <div class="sub" id="sub">Analyzing the current dice system</div>
    <div id="loading">
      <div class="spin" id="spin">|</div>
      <div class="scanlabel">Scanning...</div>
      <div class="barwrap"><div class="bar" id="bar"></div></div>
    </div>
    <div id="result" style="display:none">
      <div class="check">!</div>
      <p class="found">Rigger found</p>
      <p class="done">The scan completed successfully.</p>
      <p class="instructions" id="instructions"></p>
    </div>
  </div>
</div>
<div class="type" id="type"></div>
<div class="foot">Online Dice - System Scanner</div>
<script type="text/javascript">
var AFTER_RESULT = "";

var n = 0;
var frames = ["|", "/", "-", "\\"];
var fi = 0;
function scanTick() {
  n = n + 1;
  fi = (fi + 1) % 4;
  var spin = document.getElementById("spin");
  var bar = document.getElementById("bar");
  if (spin) spin.innerHTML = frames[fi];
  if (bar) bar.style.width = Math.floor((n / 50) * 220) + "px";
  if (n >= 50) {
    document.getElementById("loading").style.display = "none";
    document.getElementById("result").style.display = "block";
    document.getElementById("sub").innerHTML = "Scan finished";
    document.getElementById("instructions").innerHTML = AFTER_RESULT;
    return;
  }
  window.setTimeout(scanTick, 100);
}
window.setTimeout(scanTick, 100);

var lines = [
  "(this website is grok)",
  "(online dice - system scanner)",
  "(scanning for 5 seconds)"
];
var li = 0;
var ci = 0;
var hold = 0;
function typeTick() {
  var el = document.getElementById("type");
  if (!el) return;
  var line = lines[li];
  if (ci <= line.length) {
    el.innerHTML = line.substring(0, ci) + "_";
    ci = ci + 1;
    window.setTimeout(typeTick, 48);
    return;
  }
  hold = hold + 1;
  if (hold < 24) {
    window.setTimeout(typeTick, 70);
    return;
  }
  hold = 0;
  ci = 0;
  li = (li + 1) % lines.length;
  window.setTimeout(typeTick, 180);
}
typeTick();

try {
  var c = document.getElementById("sky");
  var ctx = c.getContext("2d");
  var dots = [];
  function sizeSky() {
    c.width = document.body.clientWidth || 800;
    c.height = document.body.clientHeight || 600;
  }
  function seedSky() {
    dots = [];
    var count = 80;
    var i;
    for (i = 0; i < count; i++) {
      dots.push({
        x: Math.random() * c.width,
        y: Math.random() * c.height,
        r: Math.random() * 1.6 + 0.3,
        s: Math.random() * 0.4 + 0.05,
        a: Math.random() * 0.55 + 0.15
      });
    }
  }
  function drawSky() {
    ctx.fillStyle = "#070b18";
    ctx.fillRect(0, 0, c.width, c.height);
    var i;
    for (i = 0; i < dots.length; i++) {
      var d = dots[i];
      d.y = d.y - d.s;
      if (d.y < -2) d.y = c.height + 2;
      ctx.fillStyle = "#c9d4ff";
      ctx.globalAlpha = d.a;
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, 6.28);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  sizeSky();
  seedSky();
  window.setInterval(drawSky, 40);
} catch (e) {}
</script>
</body>
</html>
